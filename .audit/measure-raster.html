<!doctype html>
<html>
  <body style="margin:0;background:#fff">
    <img id="i" src="./logo-raster.jpg" />
    <script>
      window.__measure = async () => {
        const img = document.getElementById('i');
        await img.decode();
        const W = img.naturalWidth, H = img.naturalHeight;
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const cx = c.getContext('2d', { willReadFrequently: true });
        cx.drawImage(img, 0, 0);
        const d = cx.getImageData(0, 0, W, H).data;
        const at = (x, y) => { const i = (y * W + x) * 4; return [d[i], d[i+1], d[i+2]]; };

        // 1. Corner + edge samples
        const corners = {
          tl: at(2, 2), tr: at(W - 3, 2), bl: at(2, H - 3), br: at(W - 3, H - 3),
          centre: at(W >> 1, H >> 1),
        };

        // 2. Row / column profiles of "not the page background"
        //    Background is the modal corner colour; ink is everything else.
        const bg = corners.tl;
        const isBg = (r, g, b) =>
          Math.abs(r - bg[0]) < 14 && Math.abs(g - bg[1]) < 14 && Math.abs(b - bg[2]) < 14;

        let minX = W, minY = H, maxX = -1, maxY = -1;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            if (isBg(d[i], d[i + 1], d[i + 2])) continue;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }

        // 3. Horizontal bands of ink inside the bbox -> separates monogram /
        //    wordmark / tagline so nothing gets cropped.
        const bands = [];
        for (let y = minY; y <= maxY; y++) {
          let n = 0;
          for (let x = minX; x <= maxX; x++) {
            const i = (y * W + x) * 4;
            if (!isBg(d[i], d[i + 1], d[i + 2])) n++;
          }
          bands.push(n);
        }
        // collapse into runs of empty vs non-empty
        const runs = [];
        let start = 0;
        for (let y = 1; y <= bands.length; y++) {
          const empty = y === bands.length || bands[y] === 0;
          const prevEmpty = bands[start] === 0;
          if (empty !== prevEmpty) {
            runs.push({ from: minY + start, to: minY + y - 1, kind: prevEmpty ? 'gap' : 'ink' });
            start = y;
          }
        }

        // 4. Column extent inside each ink band (so a band is never clipped)
        const bandBoxes = runs.filter((r) => r.kind === 'ink').map((r) => {
          let a = W, b = -1;
          for (let y = r.from; y <= r.to; y++) {
            for (let x = minX; x <= maxX; x++) {
              const i = (y * W + x) * 4;
              if (isBg(d[i], d[i + 1], d[i + 2])) continue;
              if (x < a) a = x;
              if (x > b) b = x;
            }
          }
          return { ...r, x0: a, x1: b };
        });

        // 5. Distinct colour census of the ink
        const census = new Map();
        for (let y = minY; y <= maxY; y += 2) {
          for (let x = minX; x <= maxX; x += 2) {
            const i = (y * W + x) * 4;
            if (isBg(d[i], d[i + 1], d[i + 2])) continue;
            const k = `${d[i] >> 4},${d[i + 1] >> 4},${d[i + 2] >> 4}`;
            census.set(k, (census.get(k) || 0) + 1);
          }
        }
        const top = [...census.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6)
          .map(([k, n]) => ({ rgb: k.split(',').map((v) => v * 16), n }));

        return {
          natural: { W, H, aspect: +(W / H).toFixed(4) },
          corners, bg,
          bbox: { minX, minY, maxX, maxY, w: maxX - minX + 1, h: maxY - minY + 1,
                  aspect: +((maxX - minX + 1) / (maxY - minY + 1)).toFixed(4),
                  fillW: +(((maxX - minX + 1) / W) * 100).toFixed(1),
                  fillH: +(((maxY - minY + 1) / H) * 100).toFixed(1) },
          runs, bandBoxes, topColours: top,
        };
      };
    </script>
  </body>
</html>
