# Netlify deployment
#
# Build settings
#   build command:  npm run build
#   publish dir:    dist
#
# The SPA redirect is essential: React Router serves real URLs like
# /projects/anything, so without it a direct visit or a refresh returns 404.

[build]
  command = "npm run build"
  publish = "dist"

# History-API fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never rewrite static assets — doing so serves HTML in place of a JS chunk.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints these filenames, so they can be cached indefinitely.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Tight CSP: no inline scripts, no eval. Vite emits no inline JS.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# Force HTTPS on every route.
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true